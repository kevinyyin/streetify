name: GapCheck
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  GapCheck:
    type: application
    platform: iOS
    sources:
      - path: GapCheck
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Streetify
        INFOPLIST_KEY_NSCameraUsageDescription: "Streetify uses both cameras to look for cars."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets: [GapCheckTests]
      commandLineArguments:
        "-showReplay": true
  GapCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GapCheckTests]
    dependencies:
      - target: GapCheck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: "$(inherited).tests"
